name: image

# builds the patched image and pushes it to ghcr.io/<owner>/send:<tag>.
# amd64 and arm64 are built on native runners and then joined into one manifest list. arm64 hosted
# runners are free for public repos, and emulating the webpack build under qemu is painfully slow.
# tag a release as <upstream-tag>-fastN (e.g. v3.4.27-fast1) to trigger this.
on:
  push:
    tags:
      - "v*-fast*"
  workflow_dispatch:

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/send

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            platform: linux/amd64
          - runner: ubuntu-24.04-arm
            platform: linux/arm64
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: ${{ matrix.platform }}
          # attestation manifests confuse the imagetools create below
          provenance: false
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
      - name: export digest
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
      - uses: actions/upload-artifact@v4
        with:
          name: digests-${{ strategy.job-index }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      packages: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digests-*
          merge-multiple: true
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: create manifest list
        run: |
          cd /tmp/digests
          docker buildx imagetools create -t "$IMAGE:$GITHUB_REF_NAME" \
            $(printf "$IMAGE@sha256:%s " *)
      - run: docker buildx imagetools inspect "$IMAGE:$GITHUB_REF_NAME"
